<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>DaVinci High-Tech · 3D Tour</title><style>body{margin:0;overflow:hidden;background:#b8c9d4;font:14px Arial}#info{position:absolute;top:12px;left:12px;background:#14222bdc;color:white;padding:13px;border-radius:12px;z-index:2}button{border:0;border-radius:9px;padding:12px;background:#fff;color:#123;font-weight:bold}#pad{position:absolute;bottom:22px;left:20px;display:grid;grid-template-columns:repeat(3,52px);gap:5px;z-index:3}#pad button{height:48px}#mode{position:absolute;bottom:24px;right:18px;z-index:3}</style></head><body><div id="info"><b>DaVinci · HIGH-TECH HOUSE</b><div>Проведите пальцем для обзора · кнопки для движения</div><div>Демонстрационная 3D-концепция</div></div><div id="pad"><span></span><button id="up">↑</button><span></span><button id="left">←</button><button id="down">↓</button><button id="right">→</button></div><button id="mode">Войти в дом</button><script type="module">import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';const scene=new T.Scene();scene.background=new T.Color(0xb5cedd);const camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x6a7880,2.4));const sun=new T.DirectionalLight(0xfff2d7,2.6);sun.position.set(10,20,8);scene.add(sun);function box(x,y,z,w,h,d,c,metal=0){const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshStandardMaterial({color:c,metalness:metal,roughness:.55}));m.position.set(x,y,z);scene.add(m);return m}box(0,-.17,0,100,.3,100,0x63836d);box(0,.05,0,13,.2,11,0xc9c7c1);box(0,3.3,0,12,.28,9,0x242a30);box(0,6.6,0,12,.28,9,0x20262c);box(-5.8,3,0,.35,6,9,0x40464a);box(5.8,3,0,.35,6,9,0x40464a);box(0,3,-4.35,12,6,.28,0x9e8c78);box(0,3,4.35,12,6,.15,0x426575,.25);for(let i=-2;i<=2;i++)box(i*2.2,3,4.47,.09,6,.11,0x1d252a);box(0,3.25,4.5,12,.12,.14,0x1d252a);box(-3,1.4,2,2,1,1,0xddd2c1);box(-3,1,2,2.5,.25,1.4,0x6c7071);box(2,1.15,-1,3,.2,1.5,0x775d43);for(let x of [1,3])for(let z of [-1.5,-.5])box(x,.55,z,.48,1,.48,0x343c40);box(1.5,3.55,0,3,.14,2,0xa5a39e);box(1.5,4.1,0,2.3,.8,1.5,0xd3d0c7);for(let i=0;i<13;i++)box(4.1,.25+i*.24,-2.5+i*.22,1,.15,.42,0x9a795b);box(0,.1,8,13,.2,6,0xb2a89c);box(0,.05,9.4,7,.08,3,0x338ca9);for(let i=0;i<5;i++)box(-6.4+i*.28,1.1,1,.15,2,3,0x856c4d);let yaw=0,pitch=-.13,inside=false;camera.position.set(15,8,20);function apply(){camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch}function setInside(){inside=!inside;camera.position.set(0,inside?1.7:8,inside?1.5:20);yaw=inside?Math.PI:0;pitch=inside?0:-.15;apply();document.querySelector('#mode').textContent=inside?'Вид снаружи':'Войти в дом'}document.querySelector('#mode').onclick=setInside;let dragging=false,px=0,py=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;yaw-=(e.clientX-px)*.006;pitch=Math.max(-1.2,Math.min(1.2,pitch-(e.clientY-py)*.006));px=e.clientX;py=e.clientY;apply()});renderer.domElement.addEventListener('pointerup',()=>dragging=false);function move(forward,side){camera.position.x+=Math.sin(yaw)*forward+Math.cos(yaw)*side;camera.position.z+=-Math.cos(yaw)*forward+Math.sin(yaw)*side}for(let [id,f,s] of [['up',.6,0],['down',-.6,0],['left',0,-.6],['right',0,.6]]){let b=document.querySelector('#'+id),interval;b.onpointerdown=e=>{e.preventDefault();move(f,s);interval=setInterval(()=>move(f,s),80)};b.onpointerup=b.onpointercancel=()=>clearInterval(interval)}window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};apply();function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}animate();</script></body></html>
